<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>Tesla sign-in done</title>
<style>body{font-family:-apple-system,system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 16px}
code{display:block;word-break:break-all;background:#f2f2f2;padding:12px;border-radius:8px}button{margin-top:12px;padding:10px 16px;font-size:16px}</style>
</head><body>
<h2>Tesla sign-in finished</h2>
<p id="msg">Copy this one-time code and paste it into Odin's secure form (not into chat). It expires in a few minutes.</p>
<code id="code">(no code found)</code>
<button onclick="navigator.clipboard.writeText(document.getElementById('code').textContent)">Copy code</button>
<p style="color:#666;font-size:13px">This page runs only in your browser. It sends nothing anywhere.</p>
<script>
const p=new URLSearchParams(location.search);
if(p.get('code')){document.getElementById('code').textContent=p.get('code')+'|'+(p.get('state')||'');}
else if(p.get('error')){document.getElementById('msg').textContent='Tesla returned an error: '+p.get('error')+' '+(p.get('error_description')||'');}
history.replaceState(null,'',location.pathname);
</script>
</body></html>
